# Agent Foundry R0 pinned deployment (AF-007, per ADR-0009).
# Images pinned by digest. Hard caps: db 2g + runtime 1g + gateway 256m = 3.25g (<= 8g). cpus 2+2+1 = 5 (<= 8). No GPU. No Redis in R0.
name: agent-foundry
x-node-placeholder: &node-placeholder
  # node:24-alpine, resolved 2026-10-13. Placeholder HTTP server until Forge's AF-005 code lands.
  image: node@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
    interval: 5s
    timeout: 3s
    retries: 20

services:
  db:
    # postgres:17 (PostgreSQL 17.11), resolved 2026-10-13
    image: postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-agent_foundry}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  runtime:
    <<: *node-placeholder
    command: ["node", "--max-old-space-size=768", "-e", "require('http').createServer((q,s)=>s.end('ok')).listen(3000)"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agent_foundry}
    ports:
      - "127.0.0.1:${RUNTIME_HOST_PORT:-3000}:3000"
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2

  gateway:
    <<: *node-placeholder
    command: ["node", "--max-old-space-size=192", "-e", "require('http').createServer((q,s)=>s.end('ok')).listen(3000)"]
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-3001}:3000"
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1

volumes:
  pgdata:
