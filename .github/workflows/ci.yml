name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres:17 (17.11), pinned by digest (AF-007)
        image: postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agent_foundry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d agent_foundry_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Throwaway CI-only credentials for the ephemeral service container.
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/agent_foundry_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check Postgres reachable
        run: |
          node --version
          pg_isready -h localhost -p 5432 -U ci -d agent_foundry_test
      - name: Install and test
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm test
      - name: Placeholder (no package.json yet)
        if: hashFiles('package.json') == ''
        run: echo "No package.json yet; CI placeholder passes."
